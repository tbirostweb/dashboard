<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="robots" content="noindex, nofollow">
  <title>Connexion — Social Dashboard</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/theme.css?v=17">
  <link rel="stylesheet" href="css/base.css?v=17">
  <link rel="stylesheet" href="css/layout.css?v=17">
  <link rel="stylesheet" href="css/components.css?v=17">
  <link rel="stylesheet" href="css/legacy.css?v=17">
</head>
<body>
  <main class="login">
    <form class="card card--feat login__card" id="login-form" novalidate>
      <div class="brand"><b aria-hidden="true">B</b><span>BirostWeb<small>Social &amp; infrastructure</small></span></div>
      <h1 class="card__title">Connexion</h1>
      <p class="login__notice" id="login-notice" role="status" hidden>Votre session a expiré, reconnectez-vous.</p>
      <div>
        <label for="password">Mot de passe administrateur</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <p class="login__error" id="login-error" role="alert"></p>
      <button class="btn btn-accent" type="submit" id="login-submit">Se connecter</button>
      <p class="login__legal"><a href="confidentialite">Politique de confidentialité</a> · <a href="conditions">Conditions d'utilisation</a></p>
    </form>
  </main>
  <script src="js/login.js?v=17"></script>
</body>
</html>
