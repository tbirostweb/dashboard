# Journal d'accès SANS query string ($uri au lieu de $request) : les codes OAuth
# (/api/auth/*/callback?code=...&state=...) ne doivent jamais être journalisés.
log_format noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    access_log /var/log/nginx/access.log noquery;
    # Redirections relatives : conserve le schéma https et le port d'origine derrière Traefik
    absolute_redirect off;

    # --- IP réelle du client derrière le reverse proxy de Dokploy (Traefik, réseau Docker privé) ---
    # Indispensable pour que l'anti brute-force de l'API compte les essais par visiteur, pas par proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # --- Résolution DNS Docker à l'exécution : nginx démarre même si le service "api" est absent ---
    resolver 127.0.0.11 valid=30s ipv6=off;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # --- Headers de sécurité (répétés dans chaque location qui ajoute ses propres headers) ---
    # img-src : CDN d'images des plateformes (avatars, miniatures, couvertures), uniquement ces suffixes.
    # Les URL sont signées et EXPIRENT : l'API les relaie sans les stocker (voir backend/src/images.js, liste identique).
    # style-src 'unsafe-inline' : attributs style="" générés par index.html et js/app.js.
    set $csp "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.cdninstagram.com https://*.fbcdn.net https://*.fbsbx.com https://*.tiktokcdn.com https://*.tiktokcdn-us.com https://*.tiktokcdn-eu.com https://*.ibytedtos.com https://*.tiktok.com https://*.licdn.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Healthcheck ---
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # --- API (backend Node, service "api" du docker-compose, réseau interne) ---
    # Jamais de cache ; en-têtes forwarded réécrits (pas de valeurs fournies par le client).
    # Mode en direct : /api/infrastructure/live, /api/live/ping (204) et les routes de données renvoient de petites
    # réponses JSON sondées toutes les 2 à 90 s. proxy_buffering on est sans effet gênant à cette taille (la réponse
    # est relayée dès qu'elle est complète, aucun flux continu), proxy_cache off + Cache-Control no-store empêchent tout
    # cache, Server-Timing et X-Data-* traversent le proxy (non masqués).
    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_buffering on;
        proxy_cache off;
        client_max_body_size 16k;
        gzip on;

        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # --- Politique de confidentialité : page publique (aucune authentification, n'appelle pas l'API) ---
    location = /confidentialite {
        default_type text/html;
        try_files /confidentialite.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    # Variantes / faute de frappe courante → URL officielle
    location = /confidentilite  { return 301 /confidentialite; }
    location = /confidentialite/ { return 301 /confidentialite; }

    # --- Conditions d'utilisation : page publique (aucune authentification, n'appelle pas l'API) ---
    location = /conditions {
        default_type text/html;
        try_files /conditions.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location = /conditions/ { return 301 /conditions; }

    # --- index.html : jamais en cache ---
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # --- Assets statiques : cache long ---
    # Pas de hash dans les noms de fichiers : pensez à versionner (?v=2) après un changement.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|ico|png|jpe?g|webp|gif)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Fallback : navigation par hash, tout le reste renvoie index.html ---
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
